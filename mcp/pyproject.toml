[project]
name = "colonial-mcp"
version = "0.1.0"
description = "MCP tools for The Colonial Advocate — generate articles in the tone of William Lyon Mackenzie via Grok."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
]

[project.scripts]
colonial-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "advocate/**/*.py"]
